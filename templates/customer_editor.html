{# Khối chỉnh sửa và quản trị mềm hồ sơ khách hàng, chỉ hiển thị khi user có quyền. #}
{% if dataset=='customers' and can_manage_customers %}
<section class="panel">
  <label><input id="deletedCustomers" type="checkbox"> Xem khách hàng đã xóa</label>
  <p id="excelSyncStatus" role="status">Đang đọc trạng thái đồng bộ Excel…</p>
  <p id="customerAdminMessage" role="status"></p>
</section>
<dialog id="customerEditor" aria-labelledby="customerEditorTitle">
  <form id="customerEditForm">
    <h2 id="customerEditorTitle">Sửa khách hàng</h2>
    <p>Chỉ cập nhật hồ sơ; giữ nguyên đơn hàng và chứng từ lịch sử.</p>
    <div id="customerEditFields" class="form-grid"></div>
    <p id="customerEditError" role="alert"></p>
    <div class="actions"><button id="saveCustomerEdit">Lưu thay đổi</button><button id="cancelCustomerEdit" type="button" class="secondary">Hủy</button></div>
  </form>
</dialog>
{% endif %}
