{% extends 'base.html' %}{% block content %}<h1>Đổi mật khẩu</h1><p>Hãy đổi mật khẩu tạm trước khi tiếp tục.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="panel narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Mật khẩu mới (ít nhất 10 ký tự)</label><input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><label for="confirm">Xác nhận mật khẩu</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password"><button>Lưu mật khẩu</button></form>{% endblock %}
