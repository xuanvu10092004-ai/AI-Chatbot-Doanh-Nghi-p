{% extends 'base.html' %}{% block content %}
<h1>Nhập hàng</h1><p class="muted">Ghi nhận chứng từ và cộng số lượng xe vào tồn kho chi nhánh. Dữ liệu mô phỏng.</p>
<p id="stockFeedback" role="status" aria-live="polite"></p>
<form id="stockForm" class="panel"><h2>Phiếu nhập mới</h2><div class="customer-fields">
<div><label for="receiptBranch">Chi nhánh</label><select id="receiptBranch" required></select></div>
<div><label for="receiptSupplier">Nhà cung cấp</label><input id="receiptSupplier" maxlength="200" required></div>
<div><label for="receiptReference">Mã chứng từ</label><input id="receiptReference" maxlength="100" required></div>
</div><div class="table-scroll"><table><thead><tr><th>Mã SP / phiên bản</th><th>Số lượng nhập</th><th>Thao tác</th></tr></thead><tbody id="receiptItems"></tbody></table></div>
<button id="addReceiptItem" type="button" class="secondary">Thêm dòng hàng</button>
<label for="receiptNotes">Ghi chú</label><textarea id="receiptNotes" maxlength="1000"></textarea>
<label><input id="receiptConfirmed" type="checkbox" required>Tôi đã kiểm tra chứng từ, chi nhánh và số lượng nhập.</label><button id="saveReceipt">Xác nhận nhập hàng</button></form>
<section class="panel"><h2>Lịch sử nhập hàng</h2><button id="refreshReceipts" class="secondary" type="button">Cập nhật</button><div id="receiptHistory" class="table-scroll"></div></section>
{% endblock %}{% block scripts %}<script src="/static/stock-receipts.js" defer></script>{% endblock %}
