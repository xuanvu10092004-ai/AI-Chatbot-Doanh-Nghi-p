{% extends 'base.html' %}{% block content %}<h1>{{ 'Khách hàng' if dataset=='customers' else 'Tồn kho chi nhánh' }}</h1><p class="muted">Dữ liệu theo phạm vi quyền của bạn.</p><form id="recordFilters" class="toolbar" data-dataset="{{ dataset }}"><label for="q">Tìm kiếm</label><input id="q" name="q" placeholder="Tên, mã hoặc thông tin liên quan"><label for="branch">Chi nhánh</label><select id="branch" name="branch"><option value="">Trong phạm vi được cấp</option>NT01</option>NT02</option>CR01</select>{% if dataset=='customers' %}<label for="status">Trạng thái</label><select id="status" name="status"><option value="">Tất cả</option><option>Tiềm năng</option><option>Đang tư vấn</option><option>Đã mua</option><option>Ngừng liên hệ</option></select>{% endif %}<label for="sort">Sắp xếp</label><select id="sort" name="sort"><option value="name">Tên</option>{% if dataset=='customers' %}<option value="date">Ngày đăng ký</option><option value="status">Trạng thái</option>{% else %}<option value="quantity">Số lượng</option><option value="price">Giá</option>{% endif %}</select><label for="direction">Thứ tự</label><select id="direction" name="direction"><option value="asc">Tăng dần</option><option value="desc">Giảm dần</option></select><button>Lọc</button></form><section id="recordTable" class="panel table-scroll" aria-live="polite">Đang tải…</section><div class="pager"><button id="previousPage" class="secondary">Trang trước</button><span id="pageInfo"></span><button id="nextPage" class="secondary">Trang sau</button><button id="retryRecords" class="secondary">Thử lại</button></div>{% endblock %}{% block scripts %}<script src="/static/records.js" defer></script>{% endblock %}
